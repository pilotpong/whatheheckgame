<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสุ่มจับฉลากห้องสัมภาษณ์</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 480px;
            width: 100%;
        }

        /* ส่วนควบคุมและแถบข้อความเคลื่อนไหว */
        .secret-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 12px;
            padding: 4px 0;
        }

        /* กล่องครอบข้อความวิ่ง */
        .marquee-container {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            background: #f8fafc;
            padding: 6px 0;
            border-radius: 4px;
            border: 1px solid #f1f5f9;
        }

        /* ข้อความวิ่งจากซ้ายไปขวา */
        .status-text {
            display: inline-block;
            font-size: 0.85rem;
            color: #64748b;
            font-weight: 500;
            letter-spacing: 0.5px;
            animation: marqueeLeftToRight 8s linear infinite;
        }

        @keyframes marqueeLeftToRight {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100%);
            }
        }

        /* ปุ่มลับ SP TG 2026 */
        .secret-toggle {
            background: none;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            padding: 5px 10px;
            font-size: 0.75rem;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .secret-toggle:hover {
            background: #f8fafc;
            color: #64748b;
        }

        h1 {
            color: #1a1a1a;
            margin-bottom: 24px;
            font-size: 1.8rem;
        }

        /* กล่องแสดงผลตัวเลข */
        .display-box {
            background: #1e293b;
            color: #38bdf8;
            font-size: 6rem;
            font-weight: bold;
            height: 160px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
            transition: color 0.3s ease;
        }

        /* ปุ่มสุ่ม */
        .btn-draw {
            background: #2563eb;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 1.25rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-draw:hover:not(:disabled) {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .btn-draw:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* รายการห้องที่สุ่มไปแล้ว */
        .history {
            margin-top: 30px;
            text-align: left;
            border-top: 1px solid #e2e8f0;
            padding-top: 20px;
        }

        .history h3 {
            font-size: 1rem;
            color: #64748b;
            margin-bottom: 12px;
        }

        .history-list {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .history-item {
            background: #e2e8f0;
            color: #334155;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* ปุ่มรีเซ็ตระบบ */
        .btn-reset {
            margin-top: 20px;
            background: transparent;
            color: #64748b;
            border: none;
            text-decoration: underline;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-reset:hover {
            color: #0f172a;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- แถบข้อความวิ่ง และปุ่มเปิด/ปิดโหมดลับ -->
    <div class="secret-control">
        <div class="marquee-container">
            <span class="status-text" id="statusText">TG Pilot Recruitment</span>
        </div>
        <button class="secret-toggle" id="secretBtn" onclick="toggleSecretMode()">SP TG 2026</button>
    </div>

    <h1>สุ่มห้องสัมภาษณ์</h1>
    
    <div class="display-box" id="display">?</div>

    <button class="btn-draw" id="drawBtn" onclick="startDraw()">กดเพื่อสุ่มห้อง</button>

    <div class="history">
        <h3>ห้องที่ถูกเลือกแล้ว:</h3>
        <div class="history-list" id="historyList">
            <!-- รายการห้องจะถูกเพิ่มที่นี่ -->
        </div>
    </div>

    <button class="btn-reset" onclick="resetSystem()">เริ่มต้นรอบใหม่</button>
</div>

<script>
    // สถานะระบบ
    let availableRooms = [1, 2, 3, 4, 5]; // ชุดห้องสุ่มปกติ (ตัดห้อง 6 ออก)
    let drawnRooms = []; // ห้องที่ถูกสุ่มไปแล้ว
    let isSecretActive = false; // สถานะโหมดพิเศษ
    let isAnimationRunning = false;

    const display = document.getElementById('display');
    const drawBtn = document.getElementById('drawBtn');
    const historyList = document.getElementById('historyList');
    const statusText = document.getElementById('statusText');

    // ข้อความแสดงสถานะ
    const TEXT_OFF = "TG Pilot Recruitment";
    const TEXT_ON = "TG Pilot Recruitment."; // มีจุดต่อท้ายเพื่อบอกสถานะ ON

    // สลับโหมดพิเศษ (ON / OFF)
    function toggleSecretMode() {
        if (isAnimationRunning) return;
        
        // ถ้าออกห้อง 6 ไปแล้ว จะไม่สามารถ Activate ได้อีก
        if (drawnRooms.includes(6)) return;

        isSecretActive = !isSecretActive;
        
        // อัปเดตข้อความบอกสถานะ
        if (isSecretActive) {
            statusText.innerText = TEXT_ON;
        } else {
            statusText.innerText = TEXT_OFF;
        }
    }

    // ฟังก์ชันกดสุ่ม
    function startDraw() {
        if (drawnRooms.length >= 6) {
            alert("จับฉลากครบทุกห้องแล้ว กรุณากดเริ่มต้นรอบใหม่");
            return;
        }

        isAnimationRunning = true;
        drawBtn.disabled = true;

        // Animation เอฟเฟกต์ระหว่างสุ่ม (วิ่งตัวเลข 1-6)
        let counter = 0;
        const animationInterval = setInterval(() => {
            // สุ่มแสดงเลข 1-6 รวมเลข 6 เพื่อความเนียน
            const randomVisual = Math.floor(Math.random() * 6) + 1;
            display.innerText = randomVisual;
            counter++;

            if (counter > 20) { // ระยะเวลาเอฟเฟกต์ (~2 วินาที)
                clearInterval(animationInterval);
                finalizeDraw();
            }
        }, 100);
    }

    // สรุปผลการสุ่ม
    function finalizeDraw() {
        let selectedRoom;

        if (isSecretActive) {
            // โหมดพิเศษกด Activate ไว้: ล็อกผลลัพธ์เป็นห้อง 6
            selectedRoom = 6;
            
            // ปิดโหมดพิเศษอัตโนมัติหลังสุ่มได้ห้อง 6
            isSecretActive = false;
            statusText.innerText = TEXT_OFF;
        } else if (availableRooms.length === 0 && !drawnRooms.includes(6)) {
            // กรณีโหมดปกติ: หากสุ่มห้อง 1-5 ครบหมดแล้ว การสุ่มครั้งถัดไปจะปล่อยห้อง 6 ออกมาโดยอัตโนมัติ
            selectedRoom = 6;
        } else {
            // โหมดปกติ: สุ่มจากห้อง 1-5 ที่เหลืออยู่
            const randomIndex = Math.floor(Math.random() * availableRooms.length);
            selectedRoom = availableRooms[randomIndex];
            
            // นำห้องที่ถูกสุ่มออก
            availableRooms.splice(randomIndex, 1);
        }

        // บันทึกและแสดงผล
        drawnRooms.push(selectedRoom);
        display.innerText = selectedRoom;

        // อัปเดตรายการประวัติ
        updateHistory();

        isAnimationRunning = false;
        
        // ถ้าจับครบหมดทุกห้องแล้ว ให้ปิดปุ่มสุ่ม
        if (drawnRooms.length < 6) {
            drawBtn.disabled = false;
        }
    }

    // อัปเดตแสดงประวัติห้องที่ถูกสุ่มไปแล้ว
    function updateHistory() {
        historyList.innerHTML = '';
        drawnRooms.forEach(room => {
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerText = `ห้อง ${room}`;
            historyList.appendChild(item);
        });
    }

    // รีเซ็ตระบบ
    function resetSystem() {
        if (confirm("ต้องการรีเซ็ตเพื่อเริ่มจับฉลากรอบใหม่หรือไม่?")) {
            availableRooms = [1, 2, 3, 4, 5];
            drawnRooms = [];
            isSecretActive = false;
            isAnimationRunning = false;
            
            statusText.innerText = TEXT_OFF;
            display.innerText = '?';
            drawBtn.disabled = false;
            historyList.innerHTML = '';
        }
    }
</script>

</body>
</html>
