<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pong Assessment</title>
<style>
  /* Palette lifted from pong.html so the two screens read as one instrument. */
  :root{
    --bg:#E9EFF8; --bgTop:#FFFFFF; --panel:#FFFFFF; --frame:#C7D5E8;
    --accent:#1B5FBF; --aqua:#0E7C6B; --danger:#C43B57; --magenta:#6D4BC4;
    --text:#1E2A3D; --muted:#6C7C93; --field:#FAFCFF;
    --go:#0F9D58; --warn:#E0A800; --err:#C62828;
    --shadow:0 1px 2px rgba(20,40,80,.06);
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{
    background:radial-gradient(120% 90% at 50% -10%, var(--bgTop) 0%, var(--bg) 65%);
    color:var(--text); font-family:var(--mono);
    -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
    -webkit-user-select:none; user-select:none;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
  }
  .machine{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

  .topbar{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .logo{font-size:26px;font-weight:700;letter-spacing:.22em}
  .tag{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}

  /* The whole sheet is one horizontal band: entry at the left, the two verdicts
     at the right, so both faces are in view at the same time. */
  .band{display:flex;gap:14px;align-items:stretch;flex-wrap:wrap}
  .card{
    background:var(--panel);border:1px solid var(--frame);border-radius:12px;
    box-shadow:var(--shadow);padding:14px;
  }
  .entry{flex:1 1 300px;min-width:280px;display:flex;flex-direction:column;gap:12px}
  .faces{flex:2 1 460px;min-width:300px;display:flex;gap:14px}
  .verdict{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 12px}

  /* Headline sits on top of its face, as the numbering on the score sheet. */
  .vnum{font-size:22px;font-weight:700;letter-spacing:.1em;color:var(--accent)}
  .vrule{width:100%;height:1px;background:var(--frame);margin:2px 0 6px}
  .face{width:100%;max-width:190px;aspect-ratio:1/1;display:block}

  .lead{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .pastein{
    font-family:inherit;font-size:13px;width:100%;padding:11px 12px;
    border:1px solid var(--frame);border-radius:8px;background:var(--field);color:var(--text);
    user-select:text;-webkit-user-select:text;
  }
  .pastein:focus{outline:none;border-color:var(--accent)}

  .fields{display:grid;grid-template-columns:1fr;gap:6px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;
       border-bottom:1px solid #EDF2F9;padding:5px 2px}
  .row:last-child{border-bottom:none}
  .rk{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .rv{
    font-family:inherit;font-size:20px;font-weight:700;text-align:right;width:96px;
    padding:8px 10px;border:1px solid var(--frame);border-radius:8px;background:var(--field);
    color:var(--text);user-select:text;-webkit-user-select:text;
  }
  .rv:focus{outline:none;border-color:var(--accent)}
  .rv.lit{animation:lit 1.1s ease-out}
  @keyframes lit{from{background:#DDEBFB}to{background:var(--field)}}

  .btns{display:flex;gap:8px;flex-wrap:wrap}
  .btn{
    font-family:inherit;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;
    background:var(--panel);color:var(--text);border:1px solid var(--frame);border-radius:8px;
    padding:11px 18px;min-height:44px;cursor:pointer;
  }
  .btn:active{background:#E6EDF7}
  .btn.prime{background:var(--accent);color:#fff;border-color:var(--accent)}
  .status{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);min-height:14px}
  .status.ok{color:var(--go)} .status.warn{color:var(--warn)} .status.err{color:var(--err)}

  /* Portrait phones: the band stacks, but the two faces stay shoulder to shoulder. */
  @media (max-width:700px){
    .faces{flex:1 1 100%}
    .face{max-width:130px}
    .vnum{font-size:18px}
  }
</style>
</head>
<body>
<div class="machine">

  <div class="topbar">
    <div class="logo">PONG</div>
    <div class="tag">Assessment</div>
  </div>

  <div class="band">

    <!-- ---- entry ---- -->
    <div class="card entry">
      <div>
        <div class="lead">Round result</div>
        <input type="text" id="pasteIn" class="pastein" style="margin-top:8px"
               autocapitalize="off" autocorrect="off" spellcheck="false">
      </div>
      <div class="btns">
        <button class="btn prime" id="pasteBtn">Paste</button>
        <button class="btn" id="clearBtn">Clear</button>
      </div>
      <div class="status" id="pasteStatus"></div>

      <div class="fields" id="fields">
        <div class="row">
          <span class="rk">A</span>
          <input class="rv" id="fA" inputmode="numeric" pattern="[0-9]*" maxlength="4">
        </div>
        <div class="row">
          <span class="rk">B</span>
          <input class="rv" id="fB" inputmode="numeric" pattern="[0-9]*" maxlength="4">
        </div>
        <div class="row">
          <span class="rk">C</span>
          <input class="rv" id="fC" inputmode="numeric" pattern="[0-9]*" maxlength="4">
        </div>
        <div class="row">
          <span class="rk">D</span>
          <input class="rv" id="fD" inputmode="numeric" pattern="[0-9]*" maxlength="4">
        </div>
        <div class="row">
          <span class="rk">E</span>
          <input class="rv" id="fE" inputmode="numeric" pattern="[0-9]*" maxlength="4">
        </div>
        <div class="row">
          <span class="rk">F</span>
          <input class="rv" id="fF" inputmode="numeric" pattern="[0-9]*" maxlength="4">
        </div>
      </div>

    </div>

    <!-- ---- the two verdicts, side by side ---- -->
    <div class="faces">
      <div class="card verdict">
        <div class="vnum">1.1</div>
        <div class="vrule"></div>
        <svg class="face" id="face1" viewBox="0 0 100 100" aria-hidden="true"></svg>
      </div>
      <div class="card verdict">
        <div class="vnum">1.2</div>
        <div class="vrule"></div>
        <svg class="face" id="face2" viewBox="0 0 100 100" aria-hidden="true"></svg>
      </div>
    </div>

  </div>
</div>

<script>
(function(){
  "use strict";

  // ---- faces -------------------------------------------------------------
  // Same three faces as the tap sheet: colour and mouth carry the whole verdict.
  var COL   = {red:"#C62828", yellow:"#E0A800", green:"#0F9D58"};
  var MOUTH = {
    red:    "M 30 72 Q 50 54 70 72",   // frowning
    yellow: "M 31 68 L 69 68",         // straight
    green:  "M 30 60 Q 50 78 70 60"    // smiling
  };
  function drawFace(el, kind){
    if(!kind){                          // nothing entered yet: an empty dial
      el.innerHTML =
        '<circle cx="50" cy="50" r="46" fill="none" stroke="#C7D5E8" '+
        'stroke-width="2" stroke-dasharray="5 6"/>';
      return;
    }
    el.innerHTML =
      '<circle cx="50" cy="50" r="46" fill="'+COL[kind]+'"/>'+
      '<circle cx="35" cy="38" r="6" fill="#ffffff"/>'+
      '<circle cx="65" cy="38" r="6" fill="#ffffff"/>'+
      '<path d="'+MOUTH[kind]+'" fill="none" stroke="#ffffff" '+
        'stroke-width="7" stroke-linecap="round"/>';
  }

  // ---- bands -------------------------------------------------------------
  // 1.1 reads the share of returnable balls actually returned.
  //     under 40 red, 41-65 yellow, over 65 green. The rule leaves 40-41 and
  //     65-66 unspoken, so each boundary value falls to the gentler band below
  //     the next cut: 40 is red, 65 is yellow.
  function bandRate(pct){
    if(pct <= 40) return "red";
    if(pct <= 65) return "yellow";
    return "green";
  }
  // 1.2 counts red balls struck: fewer is better, so the colours run the other way.
  function bandReds(n){
    if(n <= 14) return "green";
    if(n <= 24) return "yellow";
    return "red";
  }

  // ---- fields ------------------------------------------------------------
  var KEYS = ["A","B","C","D","E","F"];
  var F = {};
  KEYS.forEach(function(k){ F[k] = document.getElementById("f" + k); });
  var face1    = document.getElementById("face1"),
      face2    = document.getElementById("face2"),
      pasteIn  = document.getElementById("pasteIn"),
      pasteStatus = document.getElementById("pasteStatus");

  var numeric = KEYS.map(function(k){ return F[k]; });
  numeric.forEach(function(el){
    el.addEventListener("input", function(){
      el.value = el.value.replace(/[^0-9]/g, "").slice(0,4);
      score();
    });
  });

  function val(el){ return el.value === "" ? null : parseInt(el.value, 10); }

  // The letters are opaque on the sheet; only these two lines know that B and D
  // are the halves of the return ratio and that A is the red-ball count.
  // C, E and F are carried and stored but score nothing.
  function score(){
    var b = val(F.B), d = val(F.D), a = val(F.A);

    // 1.1 needs both halves of the ratio, and at least one ball to divide by.
    if(b === null || d === null || (b + d) === 0){
      drawFace(face1, null);
    } else {
      drawFace(face1, bandRate(b / (b + d) * 100));
    }

    // 1.2 stands on its own count and needs nothing else.
    if(a === null){
      drawFace(face2, null);
    } else {
      drawFace(face2, bandReds(a));
    }
  }

  // ---- reading the round off the clipboard -------------------------------
  // The game prints "A=23 / B=18 / C=45 / D=4 / E=62 / F=31". Labels are read
  // first so order cannot matter; a bare "23 / 18 / 45 / 4 / 62 / 31" is accepted
  // as a fallback in that printed order. A partial read is refused rather than
  // half-filled -- a silently wrong fill is worse than no fill.
  function parseResult(txt){
    var s = String(txt).replace(/[–—]/g, "-").toUpperCase();
    var got = {}, found = 0;
    KEYS.forEach(function(k){
      var m = s.match(new RegExp("\\b" + k + "\\s*[:=]?\\s*(\\d+)"));
      if(m){ got[k] = +m[1]; found++; }
    });
    if(found === KEYS.length) return got;
    // no labels: take the first six plain numbers as A..F in that order
    var bare = s.replace(/PONG\d*/g, "").match(/\d+/g);
    if(bare && bare.length >= KEYS.length){
      var o = {};
      KEYS.forEach(function(k, i){ o[k] = +bare[i]; });
      return o;
    }
    return null;
  }

  function lit(el){ el.classList.remove("lit"); void el.offsetWidth; el.classList.add("lit"); }

  function apply(txt){
    var got = parseResult(txt);
    if(!got){ say("Not a round result", "err"); return false; }
    KEYS.forEach(function(k){ F[k].value = got[k]; lit(F[k]); });
    score();
    say("Round pasted", "ok");
    return true;
  }
  function say(t, c){ pasteStatus.textContent = t; pasteStatus.className = "status" + (c ? " " + c : ""); }

  // A real paste gesture needs no permission and works everywhere, including a
  // page opened straight off disk. This is the path that actually carries the
  // round in; the button below is only a convenience on top of it.
  document.addEventListener("paste", function(e){
    if(numeric.indexOf(e.target) !== -1) return;   // a single field keeps its own paste
    var txt = ((e.clipboardData || window.clipboardData) || {getData:function(){return "";}}).getData("text");
    if(!txt || !txt.trim()) return;
    e.preventDefault();
    showAndApply(txt);
  });

  document.getElementById("pasteBtn").addEventListener("click", function(){
    // navigator.clipboard.readText() is a privileged read: it needs a secure
    // context AND a grantable origin. Opened from file:// the origin is "null",
    // so browsers refuse it outright - which is why this button looked dead.
    // Try it where it works, and otherwise hand the job to the paste gesture.
    if(navigator.clipboard && navigator.clipboard.readText){
      navigator.clipboard.readText().then(function(t){
        if(t && t.trim()) showAndApply(t); else promptPaste();
      }, promptPaste);
    } else promptPaste();
  });

  // Say which gesture to use rather than a vague "paste into the box".
  function promptPaste(){
    pasteIn.focus();
    var touch = (navigator.maxTouchPoints || 0) > 1;
    var apple = /Mac|iPhone|iPad|iPod/.test(navigator.userAgent);
    say(touch ? "Long-press the box, choose Paste"
              : (apple ? "Press \u2318V to paste" : "Press Ctrl+V to paste"));
  }
  // Drop what was read into the box as well as the fields, so the assessor can
  // see exactly what was on the clipboard and correct it in place if it is wrong.
  // Setting .value does not fire "input", so this cannot re-enter apply().
  function showAndApply(txt){
    pasteIn.value = String(txt).replace(/\s*\n\s*/g, "  ");
    apply(txt);
  }
  pasteIn.addEventListener("input", function(){
    if(pasteIn.value.trim()) apply(pasteIn.value);
  });

  document.getElementById("clearBtn").addEventListener("click", function(){
    numeric.forEach(function(el){ el.value = ""; el.classList.remove("lit"); });
    pasteIn.value = ""; say("");
    score();
  });

  score();
})();
</script>
</body>
</html>
