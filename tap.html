<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TAP</title>
<style>
  :root{
    --bg:#f6f6f6; --panel:#ffffff; --line:#d8d8d8;
    --ink:#1b2622; --ink-dim:#71807a;
    --node:#ffffff; --node-line:#141414; --path:#141414;
    --go:#0f9d58; --warn:#c2410c; --err:#c62828;
    --fade:450ms;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);
    font-family:"DejaVu Sans Mono","Courier New",monospace;color:var(--ink);
    user-select:none;-webkit-user-select:none;touch-action:none;}
  .hidden{display:none !important;}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;}
  #hud{display:flex;align-items:center;flex:0 0 auto;border-bottom:1px solid var(--line);
    background:var(--panel);z-index:20;}
  .stat{padding:9px 15px;display:flex;flex-direction:column;line-height:1;min-width:70px;}
  .stat .k{font-size:10px;letter-spacing:2px;color:var(--ink-dim);text-transform:uppercase;margin-bottom:6px;}
  .stat .v{font-size:24px;font-weight:bold;}
  .stat.hit .v{color:var(--go);} .stat.err .v{color:var(--err);}
  .stat.trail .v{font-size:15px;letter-spacing:1px;padding-top:6px;}
  .stat.clock.low .v{color:var(--err);animation:pulse .6s infinite;}
  @keyframes pulse{50%{opacity:.35}}
  .spacer{flex:1;}
  .ctrls{display:flex;gap:8px;padding:6px 12px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
  button.btn{font-family:inherit;font-size:12px;letter-spacing:1px;text-transform:uppercase;
    background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;
    padding:9px 14px;cursor:pointer;transition:background .12s,border-color .12s;}
  button.btn:hover{background:#eef2f0;border-color:var(--ink-dim);}
  button.btn:active{background:#e3e9e6;}
  button.btn.stop{color:var(--err);border-color:#eccfcf;}
  button.btn.mute{min-width:42px;}
  #field{flex:1;position:relative;overflow:hidden;}
  #back{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;}
  /* Two strands, told apart by line style rather than by which half they occupy --
     they no longer stay in halves. The points themselves are identical, so finding
     the target means following the right strand through the crossings. */
  #back .pathA{fill:none;stroke:var(--path);stroke-width:2;}
  #back .pathB{fill:none;stroke:var(--path);stroke-width:2;stroke-dasharray:9 7;}
  #back .node{fill:var(--node);stroke:var(--node-line);stroke-width:2;}
  #back .flashline{stroke:var(--go);stroke-width:5;fill:none;stroke-linecap:round;
    animation:lfade var(--fade) ease-out forwards;}
  @keyframes lfade{from{opacity:.85}to{opacity:0}}
  /* Shown only after two consecutive errors, and only during the pause between
     trials -- never appearing or changing at the go signal. */
  #back .reveal{fill:none;stroke:var(--warn);stroke-width:3;stroke-dasharray:7 7;opacity:.9;}
  /* The spine: the axis the strands weave around, not a boundary. */
  #spine{position:absolute;top:0;bottom:0;left:50%;width:0;border-left:2px solid var(--path);
    transform:translateX(-1px);z-index:1;opacity:.28;}
  .flash{position:absolute;border-radius:50%;transform:translate(-50%,-50%);z-index:8;
    pointer-events:none;background:var(--go);animation:ffade var(--fade) ease-out forwards;}
  @keyframes ffade{from{opacity:.9;transform:translate(-50%,-50%) scale(1)}
    to{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}
  .missmark{position:absolute;border-radius:50%;border:3px solid var(--err);
    transform:translate(-50%,-50%);z-index:9;pointer-events:none;
    animation:mfade .5s ease-out forwards;}
  @keyframes mfade{from{opacity:.9;transform:translate(-50%,-50%) scale(.7)}
    to{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}
  #overlay{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
    background:rgba(246,246,246,.95);overflow-y:auto;}
  #overlay.hidden{display:none;}
  .card{text-align:center;padding:24px 36px;max-width:640px;}
  .logo{font-size:clamp(40px,8vw,66px);font-weight:bold;letter-spacing:10px;color:var(--ink);margin:0 0 8px;}
  .logo .dot{color:var(--err);}
  .tag{font-size:11px;letter-spacing:4px;color:var(--ink-dim);text-transform:uppercase;margin-bottom:20px;}
  /* Landing legend: the two line styles and the reveal ring, drawn at roughly the
     board's own proportions -- point spacing about 1.5 diameters, as in play. */
  .legend{width:min(320px,78vw);height:auto;display:block;margin:4px auto 28px;}
  .legend .lgA{fill:none;stroke:var(--path);stroke-width:3;}
  .legend .lgB{fill:none;stroke:var(--path);stroke-width:3;stroke-dasharray:11 9;}
  .legend .lgN{fill:var(--node);stroke:var(--node-line);stroke-width:3;}
  .legend .lgR{fill:none;stroke:var(--warn);stroke-width:3;stroke-dasharray:7 7;}
  .bigbtn{font-family:inherit;font-size:19px;letter-spacing:3px;text-transform:uppercase;
    background:var(--go);color:#fff;border:1px solid var(--go);border-radius:5px;
    padding:14px 46px;cursor:pointer;}
  .bigbtn:active{background:#0b7f46;}
  .startbtn{font-size:clamp(24px,5vw,34px);letter-spacing:6px;padding:28px 84px;border-radius:9px;}
  .report{display:grid;grid-template-columns:1fr;gap:6px;max-width:330px;margin:0 auto;}
  .s{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    border-bottom:1px solid #ececec;padding-bottom:5px;}
  .sk{font-size:10px;letter-spacing:1px;color:var(--ink-dim);text-transform:uppercase;}
  .sv{font-size:15px;font-weight:bold;color:var(--ink);}
  .s.big .sv{font-size:21px;color:var(--go);}
  .s.bad .sv{color:var(--err);}
  .cardbtns{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:22px;}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="stat hit"><span class="k">Steps</span><span class="v" id="hits">0</span></div>
    <div class="stat err"><span class="k">Errors</span><span class="v" id="errs">0</span></div>
    <div class="stat trail"><span class="k">Trail</span><span class="v" id="trailNow">&#8212;</span></div>
    <div class="stat clock" id="clockStat"><span class="k">Time</span><span class="v" id="clock">5:00</span></div>
    <div class="spacer"></div>
    <div class="ctrls">
      <button class="btn mute" id="muteBtn">&#128266;</button>
      <button class="btn stop" id="stopBtn">Stop</button>
      <button class="btn" id="resetBtn">New paths</button>
    </div>
  </div>
  <div id="field">
    <div id="spine"></div>
    <svg id="back" preserveAspectRatio="none"></svg>
    <div id="overlay">

      <div class="card" id="startCard">
        <h1 class="logo">TAP</h1>
        <!-- Legend, not instruction: the two line styles and the reveal ring,
             laid out the way the board does it -- dashed bottom left, solid
             bottom right, four points each, climbing. -->
        <svg class="legend" viewBox="0 0 300 178" aria-hidden="true">
          <path class="lgB" d="M 24 147 L 72 113 L 24 79 L 72 45"/>
          <path class="lgA" d="M 276 147 L 228 113 L 276 79 L 228 45"/>
          <circle class="lgN" cx="24"  cy="147" r="19"/>
          <circle class="lgN" cx="72"  cy="113" r="19"/>
          <circle class="lgN" cx="24"  cy="79"  r="19"/>
          <circle class="lgN" cx="72"  cy="45"  r="19"/>
          <circle class="lgN" cx="276" cy="147" r="19"/>
          <circle class="lgN" cx="228" cy="113" r="19"/>
          <circle class="lgN" cx="276" cy="79"  r="19"/>
          <circle class="lgN" cx="228" cy="45"  r="19"/>
          <circle class="lgR" cx="228" cy="113" r="26"/>
        </svg>
        <button class="bigbtn startbtn" id="playBtn">Start</button>
      </div>

      <div class="card hidden" id="resultCard">
        <h1 class="logo" id="resultLogo">TIME<span class="dot">&#183;</span>UP</h1>
        <div class="tag">round report</div>
        <div class="report" id="gReport"></div>
        <div class="cardbtns">
          <button class="bigbtn" id="againBtn">Play again</button>
          <button class="btn" id="codeBtn">Copy round code</button>
        </div>
      </div>

    </div>
  </div>
</div>
<script>
(function(){
  "use strict";
  const $=id=>document.getElementById(id);
  const field=$('field'), back=$('back'), overlay=$('overlay');
  const startCard=$('startCard'), resultCard=$('resultCard'), gReport=$('gReport');
  const hitsEl=$('hits'), errsEl=$('errs'), trailEl=$('trailNow');
  const clockEl=$('clock'), clockStat=$('clockStat');
  const muteBtn=$('muteBtn'), codeBtn=$('codeBtn');
  const NS="http://www.w3.org/2000/svg";
  const svgEl=(tag,attrs,cls)=>{const e=document.createElementNS(NS,tag);
    for(const a in attrs)e.setAttribute(a,attrs[a]); if(cls)e.setAttribute('class',cls); return e;};

  // Round settings. Fixed rather than exposed on the page -- change them here.
  const ROUND_MIN=5;        // round length, minutes
  const RATE_PER_MIN=40;    // mean go signals per minute
  const TIMEOUT_MS=1000;    // response limit before a trial counts as a timeout
  const START_GRACE_MS=700; // quiet gap after START so a stray second tap has
                            // nowhere to land and cannot become a false start

  const STEPS=12;
  const PREMATURE_MS=100;   // faster than this is a guess that landed, not a reaction
  const DEAD_MS=450;        // guaranteed quiet gap before a go signal can fire
  const REARM_MS=240;       // pause for feedback before the next trial arms
  const FADE_MS=450;        // hit flash lifetime -- the memory difficulty knob
  const REVEAL_AFTER=2;     // consecutive errors before the live point is shown
  const GAP=1.35;           // required centre separation, in point diameters
  const SPINE_CLEAR=46;     // closest a point comes to the spine, non-crossing boards
  const SPINE_CROSS=34;     // ditto on crossing boards, where radial bands do the work
  const BAND_GAP=82;        // clear space between the two radial bands
  const BAND_FRAC=0.42;     // share of the half-width given to the inner band
  const LANE_SETS=2;        // boards before the strands start crossing
  const FAM_LANE =['zigzag','wave','pinch'];   // pinch converges but never crosses
  const FAM_CROSS=['cross','weave'];

  // ---- sound ----
  let AC=null, master=null, muted=false;
  function ensureAudio(){
    if(!AC){ try{
        AC=new (window.AudioContext||window.webkitAudioContext)();
        master=AC.createGain(); master.gain.value=muted?0:1; master.connect(AC.destination);
      }catch(e){ AC=null; } }
    if(AC&&AC.state==='suspended') AC.resume();
  }
  function toneAt(t,freq,dur,type,gain){
    if(!AC)return null;
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(gain||0.06,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02);
    return o;
  }
  const goBeepAt=(t)=>toneAt(t,920,0.05,'square',0.06);
  const sndOk =()=>{ if(AC) toneAt(AC.currentTime,1500,0.07,'sine',0.06); };
  const sndErr=()=>{ if(AC) toneAt(AC.currentTime,170,0.20,'sawtooth',0.075); };
  muteBtn.addEventListener('click',()=>{ muted=!muted; muteBtn.innerHTML=muted?'&#128263;':'&#128266;';
    if(master) master.gain.setTargetAtTime(muted?0:1,AC.currentTime,0.008); });

  // An AudioContext time -> the performance.now() instant that sound is HEARD.
  function acToPerf(tAC){
    if(!AC) return performance.now();
    if(AC.getOutputTimestamp){
      try{ const ts=AC.getOutputTimestamp();
        if(ts && typeof ts.contextTime==='number' && typeof ts.performanceTime==='number' && ts.contextTime>0)
          return ts.performanceTime + (tAC-ts.contextTime)*1000;
      }catch(e){}
    }
    const lat=(AC.outputLatency||0)+(AC.baseLatency||0);
    return performance.now() + (tAC-AC.currentTime+lat)*1000;
  }
  function evTime(e){ const t=e.timeStamp;
    return (typeof t==='number' && t>0 && t<1e12) ? t : performance.now(); }

  // ---- state ----
  let T={fw:0,fh:0,A:[],B:[],margin:38,rad:30,dy:0,minDx:0};
  function freshState(){
    return {running:false,phase:'idle',hits:0,errs:0,side:'A',cur:{A:-1,B:-1},
      endAt:0,roundMs:300000,roundStart:0,tickTimer:null,toTimer:null,rearmTimer:null,pendingOsc:null,
      t0:0,trial:null,trials:[],trialNo:0,rateMean:1500,timeoutMs:1000,
      consecErr:0,revealEl:null,lastTap:null,setNo:0,family:'',tier:'lane'};
  }
  let state=freshState();

  function fmt(ms){ms=Math.max(0,ms);const s=Math.round(ms/1000);
    return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
  function setScore(){hitsEl.textContent=state.hits;errsEl.textContent=state.errs;}

  // ---- path geometry ----
  // The strands sit on vertical grids offset by half a step, so where they cross,
  // one strand's points fall between the other's rather than level with them.
  function geometry(fh,margin){
    const dy=(fh-2*margin)/(STEPS-0.5);
    const rad=Math.max(16,Math.min(30,dy*0.76));
    const gapPx=GAP*2*rad;
    const minDx=Math.sqrt(Math.max(0,gapPx*gapPx-dy*dy));
    return {dy,rad,gapPx,minDx};
  }

  // Each family is a side assignment plus a width envelope. A smooth sinusoid is
  // impossible here: at a turning point dx goes to zero, leaving only the vertical
  // step, which is smaller than one diameter -- the points would overlap. So every
  // family alternates within its band, which forces a minimum horizontal step, and
  // the shapes come from how the band moves and breathes instead.
  function familySpec(name){
    const base=1;   // +1 is right of the spine: the solid strand always starts there
    if(name==='zigzag'){ const e=0.72+Math.random()*0.28;
      return {tier:'lane', cross:false, side:()=>base, env:()=>e}; }
    if(name==='wave'){ const f=1.1+Math.random()*1.5, ph=Math.random()*Math.PI*2;
      return {tier:'lane', cross:false, side:()=>base,
        env:p=>0.42+0.58*Math.abs(Math.sin(Math.PI*f*p+ph))}; }
    if(name==='pinch'){ const w=0.5+Math.random()*0.28;
      return {tier:'lane', cross:false, side:()=>base,
        env:p=>1-w*Math.exp(-Math.pow((p-0.5)/0.22,2))}; }
    if(name==='cross'){ const p0=0.34+Math.random()*0.32;
      return {tier:'cross', cross:true, side:p=>(p<p0?base:-base), env:()=>1}; }
    const n=2+Math.floor(Math.random()*3);   // weave: several swaps up the climb
    return {tier:'cross', cross:true,
      side:p=>base*((Math.floor(p*n)%2)?-1:1), env:()=>1};
  }

  // Radial limits, as distance from the spine. On crossing boards the two strands
  // get DISJOINT bands: when a swap briefly leaves both on the same side, being in
  // different bands is the only thing keeping their points apart. Reasoning purely
  // from "the strands are on opposite sides" is wrong -- that holds at equal
  // indices but not at adjacent ones, which is where the collisions were.
  // Solid (strand A, flip=false) always takes the wide outer band and dashed the
  // tight inner one, so crossing boards read the same way every time.
  function radialBand(spec,flip,W){
    if(!spec.cross) return {lo:SPINE_CLEAR,hi:W};
    const innerHi=SPINE_CROSS+(W-SPINE_CROSS)*BAND_FRAC;
    return flip ? {lo:SPINE_CROSS,hi:innerHi} : {lo:innerHi+BAND_GAP,hi:W};
  }

  function buildStrand(spec,flip,g,fw,fh,margin,yOff){
    const cx=fw/2, W=(fw/2)-margin;
    const rb=radialBand(spec,flip,W);
    const arr=[]; let prevX=null;
    for(let i=0;i<STEPS;i++){
      const p=i/(STEPS-1);
      const sd=(flip?-1:1)*spec.side(p,i);
      const env=Math.max(0.30,Math.min(1,spec.env(p,i)));
      const a=cx+sd*rb.lo, b=cx+sd*(rb.lo+env*(rb.hi-rb.lo));
      const lo=Math.min(a,b), hi=Math.max(a,b);
      // Alternate between the two ends of the band, jittered by exactly what the
      // minimum step leaves spare. A point sits within j of one end and the next
      // goes to the other, so |dx| >= (hi-j)-(lo+j) = minDx by construction --
      // no candidate can come out too short, however narrow the band is.
      const j=Math.max(0,((hi-lo)-g.minDx)/2);
      let atLo;
      if(prevX===null || Math.sign(prevX-cx)!==sd) atLo=Math.random()<0.5;
      else atLo=Math.abs(prevX-lo)>Math.abs(prevX-hi);   // head for the farther end
      const x=atLo ? lo+Math.random()*j : hi-Math.random()*j;
      prevX=x;
      arr.push({x, y:fh-margin-yOff-i*g.dy});
    }
    return arr;
  }

  // Every point against every other, both strands together. The previous version
  // only checked within a strand, which left cross-strand pairs unverified.
  function violations(A,B,gapPx){
    const all=A.concat(B); let n=0;
    for(let i=0;i<all.length;i++) for(let j=i+1;j<all.length;j++)
      if(Math.hypot(all[i].x-all[j].x,all[i].y-all[j].y)<gapPx) n++;
    return n;
  }

  function generateTrails(){
    const r=field.getBoundingClientRect();
    const fw=r.width, fh=r.height, margin=38;
    const g=geometry(fh,margin);
    state.setNo++;
    const pool=(state.setNo<=LANE_SETS)?FAM_LANE:FAM_CROSS;

    let A=null,B=null,name='',spec=null;
    for(let attempt=0;attempt<24 && !A;attempt++){       // generate, validate, re-roll
      name=pool[Math.floor(Math.random()*pool.length)];
      spec=familySpec(name);
      const a=buildStrand(spec,false,g,fw,fh,margin,0);
      const b=buildStrand(spec,true, g,fw,fh,margin,g.dy/2);
      if(violations(a,b,g.gapPx)===0){ A=a; B=b; }
    }
    if(!A){                                              // fall back to the safe shape
      name='zigzag'; spec=familySpec('zigzag');
      A=buildStrand(spec,false,g,fw,fh,margin,0);
      B=buildStrand(spec,true, g,fw,fh,margin,g.dy/2);
    }
    state.family=name; state.tier=spec.tier;
    T={fw,fh,A,B,margin,rad:g.rad,dy:g.dy,minDx:g.minDx};

    back.setAttribute('viewBox','0 0 '+fw+' '+fh);
    while(back.firstChild) back.removeChild(back.firstChild);
    [['A',A],['B',B]].forEach(([k,arr])=>{
      let d='M '+arr[0].x+' '+arr[0].y;
      for(let i=1;i<arr.length;i++) d+=' L '+arr[i].x+' '+arr[i].y;
      back.appendChild(svgEl('path',{d},'path'+k));
    });
    [A,B].forEach(arr=>arr.forEach(p=>
      back.appendChild(svgEl('circle',{cx:p.x,cy:p.y,r:g.rad},'node'))));
    state.cur={A:-1,B:-1}; state.side='A'; state.consecErr=0;
    clearReveal();
  }

  function cancelPending(){ if(state.pendingOsc){ try{state.pendingOsc.stop();}catch(e){} state.pendingOsc=null; } }
  function target(){ const S=state.side, ni=state.cur[S]+1;
    return ni<STEPS ? {S,i:state.cur[S],ni,p:T[S][ni]} : null; }

  function clearReveal(){ if(state.revealEl&&state.revealEl.parentNode) state.revealEl.remove();
    state.revealEl=null; }
  function showReveal(){
    clearReveal(); const t=target(); if(!t) return;
    state.revealEl=svgEl('circle',{cx:t.p.x,cy:t.p.y,r:T.rad+7},'reveal');
    back.appendChild(state.revealEl);
  }

  // ---- trial cycle ----
  function armTrial(){
    if(!state.running) return;
    const t=target(); if(!t) return;
    trailEl.textContent=(t.S==='A')?'SOLID':'DASHED';
    const amp=state.lastTap?Math.hypot(t.p.x-state.lastTap.x,t.p.y-state.lastTap.y):null;
    state.trial={S:t.S,i:t.i,ni:t.ni,p:t.p,R:T.rad,amp:amp,
      set:state.setNo,family:state.family,tier:state.tier};
    state.trialNo++;

    // Exponentially distributed foreperiod: a flat hazard rate means the signal
    // is equally likely at any instant, so there is nothing to anticipate.
    const expMean=Math.max(150,state.rateMean-DEAD_MS);
    const fp=Math.min(DEAD_MS-expMean*Math.log(1-Math.random()), DEAD_MS+expMean*3.5);

    if(AC){ const tAC=AC.currentTime+fp/1000;
      state.pendingOsc=goBeepAt(tAC); state.t0=acToPerf(tAC); }
    else { state.pendingOsc=null; state.t0=performance.now()+fp; }
    state.phase='armed';
    clearTimeout(state.toTimer);
    state.toTimer=setTimeout(onTimeout,Math.max(0,state.t0-performance.now())+state.timeoutMs);
  }

  function logTrial(outcome,rt,tapped,errPx){
    const t=state.trial;
    state.trials.push({n:state.trialNo,t:Math.round(performance.now()-state.roundStart),
      set:t.set,family:t.family,tier:t.tier,strand:t.S,target:t.ni,
      tapStrand:tapped?tapped.S:'',tapIndex:tapped?tapped.i:'',
      amp:t.amp==null?'':Math.round(t.amp), err:errPx==null?'':Math.round(errPx),
      r:Math.round(t.R), outcome:outcome, rt:(rt==null||!isFinite(rt))?'':Math.round(rt)});
  }

  function rearm(){ clearTimeout(state.rearmTimer);
    state.rearmTimer=setTimeout(()=>{ if(!state.running)return;
      if(state.consecErr>=REVEAL_AFTER) showReveal();
      armTrial(); },REARM_MS); }

  function fail(kind,rt,px,py,tapped,errPx){
    state.phase='resolving';
    cancelPending(); clearTimeout(state.toTimer);
    logTrial(kind,rt,tapped,errPx);
    state.errs++; state.consecErr++; setScore();
    // A timeout is the one error the player did nothing to cause, and it lands in
    // the quiet stretch where they are listening for the go signal -- a buzz there
    // reads as a cue. Every other error answers a deliberate tap, so it keeps its sound.
    if(kind!=='timeout') sndErr();
    if(px!=null){
      const m=document.createElement('div'); m.className='missmark';
      const d=(T.rad*2)+'px'; m.style.width=m.style.height=d;
      m.style.left=px+'px'; m.style.top=py+'px';
      field.appendChild(m); setTimeout(()=>m.remove(),520);
    }
    rearm();   // the same point fires again
  }

  function succeed(rt,errPx){
    const t=state.trial;
    state.phase='resolving';
    cancelPending(); clearTimeout(state.toTimer);
    logTrial('hit',rt,{S:t.S,i:t.ni},errPx);
    const f=document.createElement('div'); f.className='flash';
    f.style.width=f.style.height=(T.rad*2)+'px';
    f.style.left=t.p.x+'px'; f.style.top=t.p.y+'px';
    field.appendChild(f); setTimeout(()=>f.remove(),FADE_MS+40);
    const prev=t.i>=0 ? T[t.S][t.i] : null;         // point 0 has no predecessor
    if(prev){
      const ln=svgEl('line',{x1:prev.x,y1:prev.y,x2:t.p.x,y2:t.p.y},'flashline');
      back.appendChild(ln); setTimeout(()=>{if(ln.parentNode)ln.remove();},FADE_MS+40);
    }
    state.cur[t.S]=t.ni; state.hits++; state.consecErr=0; clearReveal();
    setScore(); sndOk();
    if(state.cur.A>=STEPS-1 && state.cur.B>=STEPS-1){
      clearTimeout(state.rearmTimer);
      state.rearmTimer=setTimeout(()=>{ if(state.running){
        state.lastTap=null; generateTrails(); armTrial(); } },REARM_MS+120);
      return;
    }
    state.side=(t.S==='A')?'B':'A';
    rearm();
  }

  function onTimeout(){
    if(!state.running||state.phase!=='armed')return;
    fail('timeout',null,null,null,null,null);
  }

  function pickNode(px,py){
    let best=null,bd=Infinity;
    ['A','B'].forEach(S=>{ T[S].forEach((p,i)=>{
      const d=Math.hypot(px-p.x,py-p.y);
      if(d<bd){ bd=d; best={S,i,d}; } }); });
    return (best&&best.d<=T.rad)?best:null;
  }

  field.addEventListener('pointerdown',function(e){
    if(!state.running||state.phase!=='armed')return;
    e.preventDefault();
    const rt=evTime(e)-state.t0;
    const r=field.getBoundingClientRect();
    const px=e.clientX-r.left, py=e.clientY-r.top;
    const t=state.trial;
    const errPx=Math.hypot(px-t.p.x,py-t.p.y);
    state.lastTap={x:px,y:py};
    const node=pickNode(px,py);
    if(rt<0){ fail('false-start',rt,px,py,node,errPx); return; }
    if(rt<PREMATURE_MS){ fail('premature',rt,px,py,node,errPx); return; }
    if(node && node.S===t.S && node.i===t.ni) succeed(rt,errPx);
    else if(node) fail('memory',rt,px,py,node,errPx);
    else fail('precision',rt,px,py,null,errPx);
  },{passive:false});

  // ---- statistics ----
  function sorted(a){ return a.slice().sort((x,y)=>x-y); }
  function quant(a,q){ if(!a.length)return null;
    const s=sorted(a), p=(s.length-1)*q, lo=Math.floor(p), hi=Math.ceil(p);
    return lo===hi ? s[lo] : s[lo]+(s[hi]-s[lo])*(p-lo); }
  const median=a=>quant(a,0.5);
  const ms=v=>v==null?'—':Math.round(v);   // bare number: no unit on the card
  const row=(k,v,cls)=>'<div class="s'+(cls?' '+cls:'')+'">'+
    '<span class="sk">'+k+'</span><span class="sv">'+v+'</span></div>';

  // A response is a real reaction to the signal whether or not it landed on the
  // right point. Early taps and timeouts are not reaction times.
  const isResp=t=>['hit','memory','precision'].indexOf(t.outcome)>=0 && t.rt!=='';

  // The card is labelled A..L so the player cannot tell what is being measured.
  // The key, which is for you and not for them:
  //   A boards          B median RT        C steps            D early taps
  //   E timeouts        F errors (total)   G trials           H IQR, separate boards
  //   I IQR, crossing   J steps/trials %   K memory errors    L precision errors
  // F is the grand total, so F = D + E + K + L. If that does not add up, the
  // trial log and the counters have drifted apart.
  const KEYS='ABCDEFGHIJKL';

  function report(){
    const tr=state.trials;
    const cnt=k=>tr.filter(t=>t.outcome===k).length;
    const rtsOf=a=>a.filter(isResp).map(t=>+t.rt);
    const iqrOf=r=>r.length?quant(r,0.75)-quant(r,0.25):null;
    const all=rtsOf(tr);
    const vals=[
      state.setNo,
      ms(median(all)),
      state.hits,
      cnt('false-start')+cnt('premature'),
      cnt('timeout'),
      state.errs,
      tr.length,
      ms(iqrOf(rtsOf(tr.filter(t=>t.tier==='lane')))),
      ms(iqrOf(rtsOf(tr.filter(t=>t.tier==='cross')))),
      tr.length?Math.round(state.hits/tr.length*100):'—',
      cnt('memory'),
      cnt('precision')
    ];
    gReport.innerHTML=vals.map((v,i)=>row(KEYS[i],v)).join('');
    lastVals=vals;
  }

  // The round code: the twelve card values on one line, for the assessment sheet
  // to paste in rather than have them keyed back by hand. The TAP1 tag is how the
  // other end tells this apart from whatever else is on the clipboard, and it is
  // what to bump if the letters ever change meaning. Blanks stay blank.
  let lastVals=null;
  const codeText=()=>'TAP1,'+lastVals.map(v=>v==='—'?'':v).join(',');

  // Clipboard, with the hidden-textarea route for the browsers that refuse the
  // async API. The button reports for itself and goes back to its own label.
  function copyOut(txt,btn,okLabel){
    const label=btn.textContent;
    const done=()=>{ btn.textContent=okLabel;
      setTimeout(()=>{btn.textContent=label;},1600); };
    function fallback(){
      const ta=document.createElement('textarea');
      ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); done(); }catch(e){ btn.textContent='Copy failed'; }
      ta.remove();
    }
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(txt).then(done,fallback);
    else fallback();
  }
  codeBtn.addEventListener('click',()=>{
    if(lastVals) copyOut(codeText(),codeBtn,'Code copied');
  });

  // ---- round control ----
  function tick(){const left=state.endAt-performance.now();
    clockEl.textContent=fmt(left);
    clockStat.classList.toggle('low',left<=10000&&left>0);
    if(left<=0) end();}

  function showCard(which){
    overlay.classList.remove('hidden');
    startCard.classList.toggle('hidden',which!=='start');
    resultCard.classList.toggle('hidden',which!=='result');
  }

  function start(){
    if(state.running)return;
    ensureAudio();
    state=freshState();
    state.rateMean=60000/RATE_PER_MIN; state.timeoutMs=TIMEOUT_MS; state.running=true;
    setScore();
    state.roundMs=ROUND_MIN*60000; state.roundStart=performance.now();
    state.endAt=state.roundStart+state.roundMs;
    clockEl.textContent=fmt(state.roundMs); clockStat.classList.remove('low');
    overlay.classList.add('hidden');
    generateTrails();
    // Hold the first trial briefly: the field is live the moment the overlay goes,
    // and a second tap on the big START would otherwise land as a false start.
    state.rearmTimer=setTimeout(()=>{ if(state.running) armTrial(); },START_GRACE_MS);
    state.tickTimer=setInterval(tick,200);
  }

  function halt(){
    state.running=false; state.phase='idle';
    clearInterval(state.tickTimer); clearTimeout(state.toTimer); clearTimeout(state.rearmTimer);
    cancelPending(); clearReveal();
    trailEl.textContent='—';
  }

  function end(){ halt(); report(); showCard('result'); }

  $('playBtn').addEventListener('click',start);
  $('againBtn').addEventListener('click',start);
  $('stopBtn').addEventListener('click',()=>{ halt(); showCard('start'); });
  $('resetBtn').addEventListener('click',()=>{ halt();
    while(back.firstChild) back.removeChild(back.firstChild);
    state.hits=0; state.errs=0; setScore();
    clockEl.textContent=fmt(ROUND_MIN*60000); clockStat.classList.remove('low');
    showCard('start'); });

  let rz=null;
  window.addEventListener('resize',()=>{ if(state.running)return;
    clearTimeout(rz); rz=setTimeout(()=>{ halt();
      while(back.firstChild) back.removeChild(back.firstChild); },200); });
})();
</script>
</body>
</html>
